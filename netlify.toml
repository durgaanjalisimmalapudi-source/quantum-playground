# Netlify Configuration for Quantum Playground
# Documentation: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # Vite frontend resides in the frontend/ subdirectory
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# SPA routing: Redirect all client routes to index.html with HTTP 200
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ==============================================================================
# NOTE ON FULL-STACK PYTHON BACKEND (Qiskit Aer & Database):
# Netlify alone only hosts static assets and serverless Node.js/Go functions.
# It CANNOT run continuous Python ASGI servers (FastAPI/Uvicorn) or Qiskit Aer.
#
# If you deploy your backend to Render/Railway (e.g., https://my-backend.onrender.com),
# you can either:
#   1. Set VITE_API_URL="https://my-backend.onrender.com" in Netlify Environment Variables
#   2. OR proxy /api calls directly by uncommenting below:
# ==============================================================================
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND-URL.onrender.com/api/:splat"
#   status = 200
#   force = true
